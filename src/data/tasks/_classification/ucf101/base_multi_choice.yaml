task: "ucf101_multi_choice"

model_specific_kwargs:
  default:
    pre_prompt: ""
    prompt: "What type of object is in this photo?"
    post_prompt: ""

generation_kwargs:
  max_new_tokens: 64
  do_sample: False

  rag:
    enabled: True
    database_path: cc12m/openai_ViT-B-32/index
    model_name: openai/clip-vit-base-patch32
    prompt: "These are the possible classes (one per line). Choose one of them when answering.\n{}"
    search_modality: target-classes
    grab_data_type: text
    format: newlines
include: assets/_default_template_yaml
