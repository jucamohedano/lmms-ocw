task: "caltech101_circular_v16"

doc_to_text: !function assets/_caltech101_utils.doc_to_text_multi_round
output_type: generate_until_multi_round

model_specific_kwargs:
  default:
    pre_prompt: ""
    prompts:
      - "Identify the broad semantic category of the main subject in the image (e.g., animal, vehicle, plant, scene, texture). Use only 1-2 general, lowercase words\u2014no specifics, no extra words.\nExamples:\n\nDog image: animal\nCar photo: vehicle\nFlower bloom: plant\nBeach view: scene\nFabric pattern: texture\n\nAnswer:"
      - "Refine the TARGET label:"
      - "Classify the TARGET:"
    post_prompt: ""

generation_kwargs:
  max_new_tokens: 64
  do_sample: False
  resize_input_image: 224
  rag:
    0:
      enabled: True
      database_path: "caltech101/train/openai-clip-vit-base-patch32"
      model_name: "openai/clip-vit-base-patch32"
      prompt: "<images>"
      database_format: "pt"
      search_modality: "random"
      grab_data_type: "image"
      format: "no-text"
      num_samples: 16
      separate_queries: True
      cache_and_reuse: True

      gen_batch_size: 4
    1:
      enabled: True
      pipe_from: -1
      separate_queries: True
      format: "all-image-answer-pairs"
      #
      system_prompt: "You are performing open-world visual classification with iterative refinement. Given image-label pairs from the same domain, infer distinctions (e.g., subtypes, shapes) and refine the target's label to be more specific and discriminative.\nInternal Reasoning:\n- Infer domain (e.g., animal species, vehicle models).\n- Compare visuals for differences (shape, structure, details).\n- Refine prior label: Add new subtype, no repeats. If specific, add variant (e.g., elephant \u2192 African elephant).\n\nGuidelines:\n- Refine within domain; use standard nouns.\n- Concise: 1-2 words.\n- Output ONLY the label\u2014NO extra text, NO history."
      context_prompt: "Context examples:\n"
      prompt: "Current labels: {}\n"
      end_context_prompt: "===== EXAMPLES END =====\nTARGET:"
      prompt_for_sample: "Current labels: {}\n"
      #
      keep_label_for_hot_image: True
      keep_full_history: True
      concatenate_labels: ", "
      clean_output_labels: True
      circular: True
      max_iters: 3
      cache_and_reuse: True
      gen_batch_size: 4 # Process one item at a time when generating, to avoid OOM
      resize_images: 224

    2:
      enabled: True
      pipe_from: 1
      #
      system_prompt: "You are an open-world visual classifier. Use image-label pairs from the same domain to infer distinctions (e.g., subtypes, variants). Classify the new image with a 3-level comma-separated hierarchy (broad to specific), matching context specificity with standard nouns.\nInternal Reasoning:\n- Infer domain and label patterns.\n- Compare target visuals to context.\n- Build 3 levels: Start general, add subtypes (e.g., animal, mammal, lion).\n\nGuidelines:\n- Output ONLY comma-separated hierarchy\u2014NO extra text.\n- Use precise, context-fitting nouns."
      prompt: "Context examples:\n<images>Label: {}"
      # prompt: "You are an open-world visual classifier.\nYou will see a small set of image-label pairs that belong to the same unknown domain.\nUse them to infer what kinds of distinctions matter in this domain (e.g., texture patterns, object subtypes, material differences, color or shape features).\n\nYour task is to classify a new image from the same domain.\nMatch the level of specificity shown in the context labels.\nAvoid generic words such as \"object\", \"thing\", \"vehicle\", \"animal\", \"texture\" unless they are the most specific category possible\n\nAnswer concisely with the list of coarse to fine-grained categories, following these examples:\n===== EXAMPLES START =====\n{}\n===== EXAMPLES END ====="
      end_context_prompt: "===== EXAMPLES END =====\nTARGET:"
      keep_full_history: True
      concatenate_labels: ", "
      format: "interleaved"
      resize_images: 224
      clean_answer: True
      include_image: True # Since step 0 and 1 do not put it into the context

include: assets/_default_template_yaml
