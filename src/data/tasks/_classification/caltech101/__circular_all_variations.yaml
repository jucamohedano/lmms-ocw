task: "caltech101_circular"

doc_to_text: !function assets/_caltech101_utils.doc_to_text_multi_round
output_type: generate_until_multi_round

model_specific_kwargs:
  default:
    pre_prompt: ""
    prompts:
      # - "What object is in this image?"
      # # - "What object is in this image? Provide only the object name."
      # # - "Be more specific. Provide a more fine-grained description and nothing else. Keep it short."
      # # - "Add one word to your previous answer to make it more specific."
      # # - "Using the context, re-label the object in the image making it more specific than the other examples. Keep it concise."
      # # - "What object is in this image? Be more specific."
      # # - "What object is in this image? Improve the description of the last image. Be more specific."
      # # - "Task: Using the examples only as guidance, produce a more specific concise label for the TARGET image. Output must be the label only."
      # - "Task: Using the examples only as guidance, produce a **more specific** concise label for the TARGET image. Output must be the label only. Be specific."
      # # - "Label the last image. Be concise and specific."
      # - "What object is in this image?"
      #
      #
      - "Your task is to identify the *broad semantic category* of the main object in each image.\nAnswer concisely with one or two words only, such as \"animal\", \"vehicle\", \"fruit\", \"tool\".\nAnswer:"
      - "Task: Using the examples only as guidance, and referring to the previous labels, refine the label for the TARGET image by making it more specific.\nAdd only **one new label** to the provided ones. Do not repeat previous labels.\nOutput must be the new label only."
      - "Labels: "
    post_prompt: ""

generation_kwargs:
  max_new_tokens: 64
  do_sample: False
  rag:
    0:
      enabled: True
      database_path: "caltech101/train/openai-clip-vit-base-patch32"
      model_name: "openai/clip-vit-base-patch32"
      prompt: "<images>"
      database_format: "pt"
      search_modality: "random"
      grab_data_type: "image"
      format: "no-text"
      num_samples: 16
      separate_queries: True
      cache_and_reuse: True

    1:
      enabled: True
      pipe_from: -1
      separate_queries: True
      format: "all-image-answer-pairs"
      #
      # V1
      # context_prompt: "Here are some examples of images with their descriptions:\n"
      # end_context_prompt: "===== EXAMPLES END =====\nTARGET:"
      # # prompt: "Label: {}\n"
      # prompt: "{}"
      # keep_label_for_hot_image: False
      # keep_full_history: False
      #
      # V2
      context_prompt: "You are a classifier performing iterative refinement.\nAt each step, you make the current label slightly more specific than in the previous iteration, using the context of other labeled images as a reference.\n\nOnly **add one additional level** of specificity (e.g., 'animal' becomes 'dog', 'animal, dog' becomes 'labrador'). Keep the output concise, one or two words.\n\nContext (previously labeled examples):"
      prompt: "Current labels: {}\n"
      end_context_prompt: "===== EXAMPLES END =====\nTARGET:"
      prompt_for_sample: "Current labels: {}\n"
      keep_label_for_hot_image: True
      keep_full_history: True
      concatenate_labels: ", "
      clean_output_labels: True
      #
      circular: True
      max_iters: 3
      cache_and_reuse: True
      # gen_batch_size: 1  # Process one item at a time when generating, to avoid OOM

    2:
      enabled: True
      pipe_from: 1
      # prompt: "Answering the question 'What object is in this image?' for similar images, you provided these answers:\n{}"
      # prompt: "Answering the question 'What object is in this image?' for other images, you provided these answers:\n{}"
      # prompt: "Use these examples as a guideline for specificity (how fine-grained the answer is) and format (how to structure the answer):\n{}"
      # prompt: "You are a classifier performing iterative refinement.\nAt each step, you make the current label slightly more specific than in the previous iteration, using the context of other labeled images as a reference.\n\nOnly add one additional level of specificity (e.g., 'animal' becomes 'dog', 'dog' becomes 'labrador'). Keep the output concise, one or two words.\n\nContext (previously labeled examples):\n<images>Label: {}"
      prompt: "You are a classifier capable of providing labels at varying levels of specificity.\nUsing the examples below as a guide, provide a list of labels for the TARGET image that classify it from general to specific.\n\nHere are some examples of output labels:\n<images>Labels: {}"
      end_context_prompt: "===== EXAMPLES END =====\nTARGET:"
      keep_full_history: True
      concatenate_labels: ", "
      # format: "bullet-list-captions"
      format: "interleaved"
      include_image: True # Since step 0 and 1 do not put it into the context

include: assets/_default_template_yaml
