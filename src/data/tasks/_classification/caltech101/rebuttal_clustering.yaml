task: "caltech101_rebuttal_clustering"

model_specific_kwargs:
  default:
    pre_prompt: ""
    prompt: "Task:\nClassify the TARGET image using the context to guide what level of specificity to use.\nProduce a label that fits naturally among the context labels."
    post_prompt: ""

generation_kwargs:
  max_new_tokens: 64
  do_sample: False
  resize_input_image: 224
  rag:
    enabled: True
    database_path: "caltech101/train/openai-clip-vit-base-patch32"
    model_name: "openai/clip-vit-base-patch32"
    prompt: "<images>"
    database_format: "pt"
    search_modality: "random"
    grab_data_type: "image"
    format: "no-text"
    num_samples: 16
    separate_queries: True
    kmeans_clusters: 3
    classification_prompt: "Given the above images, what object do they have in common? Provide a single label."

include: assets/_default_template_yaml
