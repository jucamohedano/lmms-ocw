task: "caltech101_circular_v9"

doc_to_text: !function assets/_caltech101_utils.doc_to_text_multi_round
output_type: generate_until_multi_round

model_specific_kwargs:
  default:
    pre_prompt: ""
    prompts:
      - "You are an expert at categorizing images based on their primary content. Analyze the provided image and identify its broad semantic category, focusing on the main object or dominant subject (e.g., if it's a texture or scene without a clear object, categorize accordingly like \"texture\" or \"scene\").\nOutput only the category in 1-2 words, nothing else—no explanations, no additional text. Examples:\n\n- A photo of a dog: \"animal\"\n- A car on a road: \"vehicle\"\n- A close-up of fabric: \"texture\"\n- A landscape view: \"scene\"\n- An apple: \"fruit\"\n- A hammer: \"tool\"\n- Satellite imagery of land: \"landscape\"\n- A flower: \"plant\"\n\nCategory for this image:"
      - "Refine the target’s label to be more specific within the inferred domain, using 1-2 standard terms (e.g., “tulip” for flower, “mountain” for scene, “dotted” for texture).\nExamples:\n- Domain: flowers; Context: “flower” (rose), “flower” (daisy); Target: “flower” (tulip) → Label: tulip\n- Domain: scenes; Context: “scene” (beach), “scene” (city); Target: “scene” (mountain) → Label: mountain\n- Domain: textures; Context: “texture” (leather), “texture” (wool); Target: “texture” (dotted) → Label: dotted\n\nLabel:"
      - "Classify TARGET with hierarchical label matching context.\nLabel:"
    post_prompt: ""

generation_kwargs:
  max_new_tokens: 64
  do_sample: False
  resize_input_image: 224
  rag:
    0:
      enabled: True
      database_path: "caltech101/train/openai-clip-vit-base-patch32"
      model_name: "openai/clip-vit-base-patch32"
      prompt: "<images>"
      database_format: "pt"
      search_modality: "random"
      grab_data_type: "image"
      format: "no-text"
      num_samples: 16
      separate_queries: True
      cache_and_reuse: True

      gen_batch_size: 4
    1:
      enabled: True
      pipe_from: -1
      separate_queries: True
      format: "all-image-answer-pairs"
      #
      system_prompt: "You are an expert in open-world visual domain discovery and iterative label refinement. For each query, you receive a set of image-label pairs from the same unknown domain and a target image to refine. Your task is to:\n- Infer the shared domain (e.g., object classes, flower species, scene types, texture patterns) by analyzing visual similarities and differences.\n- Refine the target’s label to be more specific and discriminative within the inferred domain, building hierarchically on its label history.\n- Use 1-2 word labels that are precise, standard terms (e.g., “rose” for flowers, “beach” for scenes, “striped” for textures) to match common category names.\n- Do not repeat prior labels verbatim; add distinguishing details based on context.\n- Internally reason: (a) identify domain, (b) spot visual distinctions (shape, color, structure), (c) review label history, (d) propose a concise, accurate label.\n- Output only: \"Label: [1-2 words]\". No explanations or extra text."
      context_prompt: "Context examples (same domain, previous iteration):\n"
      prompt: "Labels: {}\n"
      end_context_prompt: "===== EXAMPLES END =====\nTARGET:"
      prompt_for_sample: "Current labels: {}\n"
      #
      keep_label_for_hot_image: True
      keep_full_history: True
      concatenate_labels: ", "
      clean_output_labels: True
      circular: True
      max_iters: 3
      cache_and_reuse: True
      gen_batch_size: 4 # Process one item at a time when generating, to avoid OOM
      resize_images: 224

    2:
      enabled: True
      pipe_from: 1
      #
      system_prompt: "You are an open-world visual classifier for hierarchical labeling. Given image-label pairs from the same domain (e.g., object subtypes, flower species, scene types, texture patterns), infer the domain via visual patterns and label styles.\nTask: Classify the target image hierarchically: comma-separated levels from broad to specific (e.g., \"flower, rose\"), matching context specificity.\nInternal Reasoning:\n\n- Infer domain (e.g., \"flower species\" from labels like \"flower, daisy\").\n- Compare target features (shape, color, etc.) to examples.\n- Build 2-4 level hierarchy using context-like terms; avoid generics.\n\nGuidelines:\n- Output only: \"Label: [hierarchy]\".\n-Use precise, standard terms for accuracy."
      prompt: "Context examples (same domain):\n<images>Label: {}"
      # prompt: "You are an open-world visual classifier.\nYou will see a small set of image-label pairs that belong to the same unknown domain.\nUse them to infer what kinds of distinctions matter in this domain (e.g., texture patterns, object subtypes, material differences, color or shape features).\n\nYour task is to classify a new image from the same domain.\nMatch the level of specificity shown in the context labels.\nAvoid generic words such as \"object\", \"thing\", \"vehicle\", \"animal\", \"texture\" unless they are the most specific category possible\n\nAnswer concisely with the list of coarse to fine-grained categories, following these examples:\n===== EXAMPLES START =====\n{}\n===== EXAMPLES END ====="
      end_context_prompt: "===== EXAMPLES END =====\nTARGET:"
      keep_full_history: True
      concatenate_labels: ", "
      format: "interleaved"
      resize_images: 224
      clean_answer: True
      include_image: True # Since step 0 and 1 do not put it into the context

include: assets/_default_template_yaml
