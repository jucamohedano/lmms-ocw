task: "fgvc_aircraft_multi_choice_random_with_labels_v4"

doc_to_text: !function assets/_fgvc_aircraft_utils.doc_to_text_multi_round
output_type: generate_until_multi_round

model_specific_kwargs:
  default:
    pre_prompt: ""
    prompts:
      - "Answer:"
      - "Answer:"
      - "Answer:"
    post_prompt: ""

generation_kwargs:
  max_new_tokens: 64
  do_sample: False
  resize_input_image: 224 # Textual inclusion: 16.02 with it
  rag:
    0:
      enabled: True
      database_path: "fgvc_aircraft/train/openai-clip-vit-base-patch32" # no need for DB path, it's constructed dynamically # "fgvc_aircraft/train/openai-clip-vit-base-patch32"
      model_name: "openai/clip-vit-base-patch32"
      system_prompt: "You are a precise image classifier. Classify the given image into **exactly one** of the categories below. Output **only the chosen category name**, nothing else."
      prompt: "<images>"
      database_format: "pt"
      search_modality: "random"
      grab_data_type: "image"
      format: "no-text"
      num_samples: 8 # 15
      separate_queries: True
      cache_and_reuse: True
      # include_input_separately: True  # Include the image to be classified in the retrieved set, but only for its own query
      include_target_classes: "pre-query"
      target_classes_format: "bullet-list"
      target_classes_prompt: "What object is in the photo? Choose exactly one:\n{}"

    1:
      enabled: True
      pipe_from: -1
      separate_queries: True
      format: "all-image-answer-pairs"
      system_prompt: "You are a precise image classifier. Classify the TARGET image into **exactly one** of the categories below. Output **only the chosen category name**, nothing else."
      context_prompt: "If the current label for the TARGET image is incorrect, you can update it by choosing it from the list of classes.\nUse these examples (labels might be wrong!) to guide your choice:"
      context_prompt_no_samples: "Choose only one label for the TARGET image from the list of classes provided."
      prompt: "Current label: {}\n"
      end_context_prompt: "===== EXAMPLES END =====\nTARGET:"
      end_context_prompt_no_samples: "TARGET:"
      prompt_for_sample: "Current label: {}\n"
      keep_label_for_hot_image: False
      keep_full_history: False
      # concatenate_labels: ", "
      clean_output_labels: True
      circular: True
      max_iters: 3 # Textual inclusion: 16.03 with 3 iters
      cache_and_reuse: True
      gen_batch_size: 16 # Process one item at a time when generating, to avoid OOM
      include_input: False # Include the image to be classified in the retrieved set
      resize_images: 224
      include_target_classes: "pre-query"
      target_classes_format: "bullet-list"
      target_classes_prompt: "What object is in the photo? Choose exactly one:\n{}"
      remove_when_labels_change: True # Remove samples where the label changed between iterations

    2:
      enabled: True
      pipe_from: 1
      system_prompt: "You are a precise image classifier. Classify the TARGET image into **exactly one** of the categories below. Output **only the chosen category name**, nothing else."
      prompt: "Based on the examples, classify the TARGET image.\n<images>Label: {}"
      end_context_prompt: "===== EXAMPLES END =====\nTARGET:"
      keep_full_history: True
      # concatenate_labels: ", "
      format: "interleaved"
      resize_images: 224 # max size, either width or height, keeping aspect ratio
      include_image: True # Since step 0 and 1 do not put it into the context
      include_target_classes: "pre-query"
      target_classes_format: "bullet-list"
      target_classes_prompt: "What object is in the photo? Choose exactly one:\n{}"
      remove_when_labels_change: True # Remove samples where the label changed between iterations

include: assets/_default_template_yaml
