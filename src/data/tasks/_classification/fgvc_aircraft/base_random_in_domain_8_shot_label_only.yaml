task: "fgvc_aircraft_random_in_domain_8_shot_label_only"

model_specific_kwargs:
  default:
    pre_prompt: ""
    prompt: "Label:"
    post_prompt: ""

generation_kwargs:
  max_new_tokens: 64
  do_sample: False
  rag:
    enabled: True
    database_path: "fgvc_aircraft/train/openai-clip-vit-base-patch32"
    model_name: "openai/clip-vit-base-patch32"
    prompt: "Here are some examples of output labels, unrelated to the input:\n{}"

    database_format: "pt"
    search_modality: "in-domain"
    grab_data_type: "text"
    format: "newlines"
    num_samples:
    limit: 8
    shuffle: True
include: assets/_default_template_yaml
