task: "dtd_rag_images_pre"

model_specific_kwargs:
  default:
    pre_prompt: ""
    prompt: "What type of object is in this photo?"
    post_prompt: ""

generation_kwargs:
  max_new_tokens: 64
  do_sample: False
  rag:
    enabled: True
    database_path: "cc12m/openai_ViT-B-32/index"
    model_name: "openai/clip-vit-base-patch32"
    search_modality: "image"
    grab_data_type: "image"
    # prompt: "You are an intelligent assistant capable of generating accurate and detailed captions for images. You will be given some retrieved images and their keywords. The last image is the input image, others are retrieved examples to help you. Response the caption for the image directly, do not include any explanations or unrelated details.\n<images>\nImage: The following image.\nRetrieved keywords: {}"

    prompt: "You are an intelligent assistant capable of generating accurate and detailed captions for images. You will be given some retrieved images and their keywords. The last image is the input image, others are retrieved examples to help you. Response the caption for the image directly, do not include any explanations or unrelated details.<images>Image: The following image.\nRetrieved_Image_Caption:\n{}"

    # prompt: "You are an intelligent assistant capable of classifying objects in images accurately. You will be given some retrieved images and their captions. The last image is the input image, others are retrieved examples to help you. Provide the name of the object in the image directly, do not include any explanations or unrelated details.<images>Corresponding captions: {}\nClassify the following image:"

    # prompt: "You are an intelligent assistant capable of generating accurate and detailed captions for images. You will be given some retrieved images and their keywords. Response the object for the image directly, do not include any explanations or unrelated details. Retrieved images:<images>Retrieved keywords: {}.\nThis is the input image:"
    position: "pre-sample"
    # format: "cased"
    format: "list-captions"
    limit: 4

include: assets/_default_template_yaml
